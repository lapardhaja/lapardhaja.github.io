<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#071a2d">
  <meta name="robots" content="noindex">
  <link rel="icon" href="images/Logo.png">
  <title>Page not found | Servet Lapardhaja</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=IBM+Plex+Sans:wght@500;600;700&family=Libre+Baskerville:wght@400&display=swap');
    :root { --navy:#071a2d; --paper:#f4f1e9; --gold:#e1ae43; --blue:#62a8d3; }
    * { box-sizing:border-box; }
    body { display:grid; min-height:100svh; margin:0; padding:2rem; place-items:center; color:var(--paper); background:linear-gradient(135deg,#04111f,var(--navy)); font:1rem/1.55 'IBM Plex Sans',sans-serif; }
    main { position:relative; width:min(780px,100%); padding:clamp(2rem,7vw,5rem); overflow:hidden; border:1px solid rgba(244,241,233,.2); background:rgba(7,26,45,.75); }
    main::after { position:absolute; top:-16rem; right:-12rem; width:30rem; height:30rem; border:1px solid rgba(225,174,67,.45); border-radius:50%; content:''; }
    p { position:relative; z-index:1; margin:0; } .eyebrow { color:#f4cd76; font:500 .82rem/1 'DM Mono',monospace; letter-spacing:.07em; text-transform:uppercase; }
    h1 { position:relative; z-index:1; max-width:630px; margin:1.7rem 0; font:400 clamp(3rem,9vw,6.3rem)/1.02 'Libre Baskerville',Georgia,serif; letter-spacing:-.07em; }
    .copy { max-width:480px; color:#bed0dc; font-size:1.08rem; }
    a { position:relative; z-index:1; display:inline-flex; align-items:center; min-height:52px; margin-top:2.2rem; padding:.8rem 1.1rem; color:var(--navy); background:var(--gold); font-weight:700; text-decoration:none; }
    a:focus-visible { outline:2px solid var(--blue); outline-offset:5px; }
  </style>
</head>
<body>
  <main><p class="eyebrow">404 / Route not found</p><h1>This page went off route.</h1><p class="copy">The link may have moved. The rest of the portfolio is still ready to explore.</p><a href="/">Return home</a></main>
</body>
</html>
